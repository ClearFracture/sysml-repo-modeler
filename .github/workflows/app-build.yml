name: Build - sysmlrenderer-app

on:
  push:
    branches: [main, master]
    paths:
      - 'src/ui/**'
      - 'src/backend/**'
      - 'src/backend/sysml-backend/Dockerfile'
      - '.github/workflows/app-build.yml'
  pull_request:
    paths:
      - 'src/ui/**'
      - 'src/backend/**'
      - 'src/backend/sysml-backend/Dockerfile'
      - '.github/workflows/app-build.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: app-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Only authenticate when we intend to push (skipped on pull requests).
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/sysmlrenderer-app
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/backend/sysml-backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
